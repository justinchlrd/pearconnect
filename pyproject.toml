[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pearsync"
version = "0.2.0"
description = "Transfert de lecture entre instances Pear Desktop (YouTube Music) via leur API Server"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pearsync = "pearsync.cli:main"

[project.gui-scripts]
pearsync-agent = "pearsync.cli:agent_main"

[tool.setuptools]
packages = ["pearsync"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
