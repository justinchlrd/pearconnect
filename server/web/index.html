<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d14">
<title>Pear Connect</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23ff4e45'/%3E%3Cpath d='M9.5 7v10l8-5z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f0d14; --surface: #1a1722; --surface-2: #242030; --line: #2f2a3d;
    --text: #f2eff7; --muted: #9b94ab; --accent: #ff4e45; --accent-ink: #fff;
    --ok: #3ccf8e; --radius: 16px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f4f9; --surface: #ffffff; --surface-2: #eeebf3; --line: #ddd8e6;
            --text: #1b1724; --muted: #6c6579; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); border-radius: var(--radius); padding: 16px; }
  .now { display: grid; gap: 16px; }
  /* miniature YouTube 4:3 avec bandes noires : on agrandit pour ne garder que l'image 16:9, recadrée en carré */
  .art { width: 100%; aspect-ratio: 1; border-radius: 12px; background: var(--surface-2) center / auto 134% no-repeat; }
  .meta { min-width: 0; }
  .where { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .title { font-size: 22px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artist { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; margin-top: 6px; font-size: 12px; padding: 2px 8px; border-radius: 99px;
    background: var(--surface-2); color: var(--muted); }
  .bar { position: relative; height: 24px; display: flex; align-items: center; cursor: pointer; }
  .bar::before { content: ""; position: absolute; inset: 10px 0; border-radius: 2px; background: var(--surface-2); }
  .fill { position: absolute; left: 0; top: 10px; height: 4px; border-radius: 2px; background: var(--text); }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 28px; }
  .controls button { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
  .controls .play { width: 64px; height: 64px; background: var(--text); color: var(--bg); }
  svg { width: 26px; height: 26px; fill: currentColor; }
  .empty { color: var(--muted); text-align: center; padding: 32px 8px; }
  .volume { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); }
  .volume svg { width: 22px; height: 22px; flex: none; }
  .volume input { padding: 0; border: 0; background: none; accent-color: var(--accent); }
  .queue { display: grid; gap: 2px; }
  .queue .qrow { display: flex; align-items: center; gap: 2px; }
  .queue .qmain { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; text-align: left;
    flex: 1; min-width: 0; padding: 6px; border-radius: 10px; }
  .queue .qmain:hover { background: var(--surface); }
  .queue .qctl { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
  .queue .qctl svg { width: 22px; height: 22px; }
  .queue .qctl:hover:not(:disabled) { background: var(--surface); color: var(--text); }
  .queue .qctl:disabled { opacity: .25; }
  .queue .qa { width: 40px; height: 40px; border-radius: 6px; background: var(--surface-2) center / auto 134% no-repeat; }
  .queue .qt { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue .qs { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 24px 4px 8px; }
  .devices { display: grid; gap: 8px; }
  .device { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center;
    background: var(--surface); border-radius: 12px; padding: 12px; border: 1px solid transparent; }
  .device.active { border-color: var(--accent); }
  .device.offline { opacity: .55; }
  .device .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; }
  .device .ico svg { width: 22px; height: 22px; }
  .device .name { font-weight: 600; }
  .device .sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .device .info { min-width: 0; }
  .pill { padding: 8px 14px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; }
  .here { font-size: 13px; color: var(--accent); font-weight: 600; }

  .login { display: grid; gap: 12px; }
  .login p { margin: 0; color: var(--muted); font-size: 14px; }
  input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text); font: inherit; }
  .link { color: var(--muted); font-size: 13px; text-decoration: underline; }
  .toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--surface-2); color: var(--text); padding: 10px 16px; border-radius: 10px; font-size: 14px;
    box-shadow: 0 6px 24px rgb(0 0 0 / .3); max-width: calc(100% - 32px); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
  @media (min-width: 520px) { .now { grid-template-columns: 180px 1fr; align-items: center; } .now .player { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pear <span>Connect</span></h1>
    <div class="status"><span class="dot" id="dot"></span><span id="conn">hors ligne</span></div>
  </header>

  <section class="card login" id="login" hidden>
    <p>Colle le jeton d'un de tes appareils (créé avec <code>add-device</code> sur le serveur).</p>
    <input id="token" type="password" autocomplete="off" placeholder="Jeton" aria-label="Jeton">
    <button class="pill" id="save">Se connecter</button>
  </section>

  <div id="app" hidden>
    <section class="card now" id="now" aria-live="polite">
      <div class="art" id="art" role="img" aria-label="Pochette"></div>
      <div class="meta">
        <div class="where" id="where"></div>
        <div class="title" id="title"></div>
        <div class="artist" id="artist"></div>
        <span class="badge" id="badge" hidden></span>
      </div>
      <div class="player">
        <div class="bar" id="bar" role="slider" aria-label="Position" tabindex="0"><div class="fill" id="fill"></div></div>
        <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
        <div class="controls">
          <button id="prev" aria-label="Titre précédent"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button id="toggle" class="play" aria-label="Lecture"><svg viewBox="0 0 24 24" id="toggleIco"><path d="M8 5v14l11-7z"/></svg></button>
          <button id="next" aria-label="Titre suivant"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        </div>
        <label class="volume" id="volumeRow" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <input type="range" id="volume" min="0" max="100" aria-label="Volume de l'appareil">
        </label>
      </div>
    </section>
    <div class="card empty" id="nothing" hidden>Rien en lecture pour l'instant.</div>

    <h2>Appareils</h2>
    <div class="devices" id="devices"></div>
    <section id="queueBox" hidden>
      <h2>À suivre</h2>
      <div class="queue" id="queue"></div>
    </section>
    <p style="text-align:center;margin-top:24px"><button class="link" id="logout">Changer de jeton</button></p>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<template id="deviceTpl">
  <div class="device">
    <div class="ico"></div>
    <div class="info"><div class="name"></div><div class="sub"></div></div>
    <div class="act"></div>
  </div>
</template>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const ICONS = {
  pear: '<svg viewBox="0 0 24 24"><path d="M3 5h18v11H3zm2 2v7h14V7zM8 18h8v2H8z"/></svg>',
  android: '<svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 3v13h10V5zm4 14v1h2v-1z"/></svg>',
  other: '<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0 10c-2 0-3.6-1-4.5-2.3C8.1 13.6 10.6 13 12 13s3.9.6 4.5 1.7C15.6 16 14 17 12 17z"/></svg>',
};
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';

const store = {
  get() { try { return localStorage.getItem("pearconnect.token") || ""; } catch { return ""; } },
  set(v) { try { v ? localStorage.setItem("pearconnect.token", v) : localStorage.removeItem("pearconnect.token"); } catch {} },
};
let token = store.get();
let snap = null, snapAt = 0, abort = null, retry = 1000;

function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3500); }
function setLive(live) { $("dot").classList.toggle("live", live); $("conn").textContent = live ? "en direct" : "reconnexion…"; }

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { Authorization: `Bearer ${token}`, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) { logout("Jeton refusé."); throw new Error("401"); }
  if (!res.ok) { let msg = `Erreur ${res.status}`; try { msg = (await res.json()).error || msg; } catch {} throw new Error(msg); }
  return res.status === 204 ? null : res.json().catch(() => null);
}

function position() {
  const st = snap?.session?.state; if (!st) return 0;
  let p = st.position + (st.paused ? 0 : (Date.now() - snapAt) / 1000);
  if (st.duration > 0) p = Math.min(p, st.duration);
  return p;
}

function render() {
  const st = snap?.session?.state;
  $("now").hidden = !st; $("nothing").hidden = !!st;
  if (st) {
    const dev = snap.session.device, online = snap.devices[dev]?.online;
    $("where").textContent = st.paused ? `En pause sur ${dev}` : `En lecture sur ${dev}`;
    if (!online) $("where").textContent += " (hors ligne)";
    $("title").textContent = st.title || st.video_id;
    $("artist").textContent = st.artist || "";
    $("art").style.backgroundImage = /^[\w-]{11}$/.test(st.video_id) ? `url("https://i.ytimg.com/vi/${st.video_id}/hqdefault.jpg")` : "";
    const pid = st.playlist_id || "";
    $("badge").hidden = !pid;
    $("badge").textContent = pid.startsWith("RD") ? "Mix" : pid.startsWith("OLAK") ? "Album" : "Playlist";
    $("toggleIco").innerHTML = st.paused ? PLAY : PAUSE;
    $("toggle").setAttribute("aria-label", st.paused ? "Lecture" : "Pause");
    for (const b of ["prev", "toggle", "next"]) $(b).disabled = !online;
    const vol = Number.isFinite(st.volume) && online;
    $("volumeRow").hidden = !vol;
    if (vol && document.activeElement !== $("volume")) $("volume").value = st.volume;
    tick();
  }
  renderQueue(st, st && snap.devices[snap.session.device]?.online);
  const list = $("devices"); list.replaceChildren();
  const names = Object.keys(snap?.devices || {});
  if (!names.length) { const e = document.createElement("div"); e.className = "card empty"; e.textContent = "Aucun appareil connecté."; list.append(e); }
  for (const name of names) {
    const d = snap.devices[name], node = $("deviceTpl").content.firstElementChild.cloneNode(true);
    const isActive = snap.active === name;
    node.classList.toggle("active", isActive); node.classList.toggle("offline", !d.online);
    node.querySelector(".ico").innerHTML = ICONS[d.kind] || ICONS.other;
    node.querySelector(".name").textContent = name;
    node.querySelector(".sub").textContent = !d.online ? "Hors ligne" : d.state ? `${d.state.paused ? "En pause" : "En lecture"} · ${d.state.title || ""}` : "Disponible";
    const act = node.querySelector(".act");
    if (isActive && st) { const s = document.createElement("span"); s.className = "here"; s.textContent = "Actif"; act.append(s); }
    else if (st) {
      const b = document.createElement("button"); b.className = "pill"; b.textContent = "Écouter ici"; b.disabled = !d.online;
      b.addEventListener("click", () => transfer(name, b)); act.append(b);
    }
    list.append(node);
  }
}

function renderQueue(st, online) {
  const rows = (online && st?.queue) || [];
  $("queueBox").hidden = !rows.length;
  const box = $("queue"); box.replaceChildren();
  const shown = rows.slice(0, 25);
  // rang dans « à suivre » (0 = juste après le titre en cours) : départage les doublons côté appareil
  const edit = (path, label, disabled, action, extra) => {
    const b = document.createElement("button"); b.className = "qctl"; b.disabled = disabled;
    b.setAttribute("aria-label", label); b.title = label;
    b.innerHTML = `<svg viewBox="0 0 24 24"><path d="${path}"/></svg>`;
    b.addEventListener("click", () => control(action, extra));
    return b;
  };
  shown.forEach((row, i) => {
    const line = document.createElement("div"); line.className = "qrow";
    const b = document.createElement("button"); b.className = "qmain";
    const a = document.createElement("div"); a.className = "qa";
    if (/^[\w-]{11}$/.test(row.video_id)) a.style.backgroundImage = `url("https://i.ytimg.com/vi/${row.video_id}/hqdefault.jpg")`;
    const info = document.createElement("div"); info.style.minWidth = "0";
    const t = document.createElement("div"); t.className = "qt"; t.textContent = row.title || row.video_id;
    const s2 = document.createElement("div"); s2.className = "qs"; s2.textContent = row.artist || "";
    info.append(t, s2); b.append(a, info);
    b.setAttribute("aria-label", `Jouer ${row.title || row.video_id}`);
    b.addEventListener("click", () => control("jump", { video_id: row.video_id }));
    line.append(b,
      edit("M7 14l5-5 5 5z", "Monter", i === 0, "move", { video_id: row.video_id, index: i, to: i - 1 }),
      edit("M7 10l5 5 5-5z", "Descendre", i === rows.length - 1, "move", { video_id: row.video_id, index: i, to: i + 1 }),
      edit("M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z",
        "Retirer de la file", false, "remove", { video_id: row.video_id, index: i }));
    box.append(line);
  });
}

function tick() {
  const st = snap?.session?.state; if (!st) return;
  const p = position();
  $("pos").textContent = fmt(p); $("dur").textContent = fmt(st.duration);
  $("fill").style.width = st.duration > 0 ? `${(p / st.duration) * 100}%` : "0";
  $("bar").setAttribute("aria-valuenow", Math.floor(p));
}
setInterval(tick, 500);

async function control(action, extra) {
  try { await api("POST", "/v1/control", { action, ...extra }); } catch (e) { if (e.message !== "401") toast(e.message); }
}
async function transfer(target, btn) {
  btn.disabled = true; btn.textContent = "Transfert…";
  try { await api("POST", "/v1/transfer", { target }); toast(`Lecture transférée vers ${target}`); }
  catch (e) { if (e.message !== "401") toast(e.message); btn.disabled = false; btn.textContent = "Écouter ici"; }
}

$("toggle").addEventListener("click", () => control(snap?.session?.state?.paused ? "play" : "pause"));
$("prev").addEventListener("click", () => control("previous"));
$("volume").addEventListener("change", (ev) => control("volume", { level: Number(ev.target.value) }));
$("next").addEventListener("click", () => control("next"));
$("bar").addEventListener("click", (ev) => {
  const st = snap?.session?.state; if (!st?.duration) return;
  const r = $("bar").getBoundingClientRect();
  control("seek", { seconds: Math.round(((ev.clientX - r.left) / r.width) * st.duration) });
});
$("bar").addEventListener("keydown", (ev) => {
  const d = { ArrowLeft: -10, ArrowRight: 10 }[ev.key]; if (!d) return;
  ev.preventDefault(); control("seek", { seconds: Math.max(0, Math.round(position() + d)) });
});

// Flux temps réel : fetch + lecture du flux (EventSource ne permet pas d'en-tête Authorization).
async function stream() {
  abort?.abort(); abort = new AbortController();
  try {
    const res = await fetch("/v1/events", { headers: { Authorization: `Bearer ${token}` }, signal: abort.signal, cache: "no-store" });
    if (res.status === 401) return logout("Jeton refusé.");
    if (!res.ok || !res.body) throw new Error(String(res.status));
    setLive(true); retry = 1000;
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const data = chunk.split("\n").filter((l) => l.startsWith("data: ")).map((l) => l.slice(6)).join("\n");
        if (data) { snap = JSON.parse(data); snapAt = Date.now(); render(); }
      }
    }
  } catch (e) { if (e.name === "AbortError") return; }
  setLive(false);
  setTimeout(stream, retry); retry = Math.min(retry * 2, 15000);
}

function logout(msg) { abort?.abort(); token = ""; store.set(""); show(); if (msg) toast(msg); }
function show() { $("login").hidden = !!token; $("app").hidden = !token; if (token) stream(); else setLive(false); }
$("save").addEventListener("click", () => { token = $("token").value.trim(); if (!token) return; store.set(token); $("token").value = ""; show(); });
$("token").addEventListener("keydown", (e) => { if (e.key === "Enter") $("save").click(); });
$("logout").addEventListener("click", () => logout());
document.addEventListener("visibilitychange", () => { if (!document.hidden && token) stream(); });
show();
</script>
</body>
</html>
